name: Terraform drift detection

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: terraform-webapp-state
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TERRAFORM_VERSION: "1.16.0"

jobs:
  drift:
    name: Detect infrastructure drift
    runs-on: ubuntu-latest

    steps:
      - name: Check out default branch
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: terraform-drift-${{ github.run_id }}

      - name: Initialize remote backend
        run: terraform init -input=false

      - name: Run refresh-only plan
        id: drift
        shell: bash
        run: |
          set +e
          terraform plan \
            -refresh-only \
            -input=false \
            -no-color \
            -detailed-exitcode \
            -lock-timeout=5m \
            -var='aws_profile=' \
            > terraform-drift.txt 2>&1
          exitcode=$?
          set -e

          echo "exitcode=$exitcode" >> "$GITHUB_OUTPUT"
          cat terraform-drift.txt

          if [ "$exitcode" -eq 1 ]; then
            exit 1
          fi

      - name: Write drift summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Terraform drift check"
            echo
            case "${{ steps.drift.outputs.exitcode }}" in
              0) echo "No drift detected." ;;
              2) echo "Infrastructure drift detected. Review is required." ;;
              *) echo "Drift detection failed. Review the workflow logs." ;;
            esac
            echo
            echo "The complete refresh-only plan is attached as a workflow artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: terraform-drift-${{ github.run_id }}
          path: terraform-drift.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Create or update drift issue
        if: steps.drift.outputs.exitcode == '2'
        uses: actions/github-script@v9
        with:
          script: |
            const title = 'Terraform infrastructure drift detected';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'Terraform detected differences between the managed AWS resources and the recorded state.',
              '',
              `Commit checked: ${context.sha}`,
              `[Review the refresh-only plan artifact and workflow run](${runUrl})`,
              '',
              'Do not automatically apply until the drift has been reviewed.'
            ].join('\n');
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }

      - name: Close resolved drift issue
        if: steps.drift.outputs.exitcode == '0'
        uses: actions/github-script@v9
        with:
          script: |
            const title = 'Terraform infrastructure drift detected';
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: 'The latest manual check found no remaining Terraform drift. Closing this issue.'
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed'
              });
            }

      - name: Create workflow failure issue
        if: failure() && steps.drift.outputs.exitcode != '2'
        uses: actions/github-script@v9
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Terraform drift detection workflow failed',
              body: `The drift check could not complete. [Review the failed workflow run](${runUrl}).`
            });
